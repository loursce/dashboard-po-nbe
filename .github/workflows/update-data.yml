name: Update dashboard data

on:
  schedule:
    # Runs every day at 08:07 UTC
    - cron: '7 8 * * *'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push data.json

    steps:
      - name: Checkout dashboard repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch data from knowledge-base
        env:
          GH_TOKEN: ${{ secrets.KB_TOKEN }}
        run: node scripts/fetch-data.mjs

      - name: Commit and push data.json
        run: |
          git config user.name  "Dashboard Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          # Only commit if data.json actually changed
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "chore: update dashboard data [skip ci]"
            git push
          )
